name: mini_swe_agent
description: >-
  A minimal tool-calling coding-agent loop for Dart, built on
  package:ai_primitives. Includes a single-turn BasicAgent and a
  multi-turn MiniSweAgent that runs generate-execute until the model
  stops calling tools.
version: 0.1.0

environment:
  sdk: ^3.6.0
resolution: workspace

dependencies:
  ai_primitives: ^0.1.0
  equatable: ^2.0.7

dev_dependencies:
  lints: ^6.0.0
  test: ^1.25.6
