name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    name: Format, analyze, and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dart-lang/setup-dart@v1
        with:
          sdk: stable

      - uses: bluefireteam/melos-action@v3

      - name: Check formatting
        run: melos run format

      - name: Analyze
        run: melos run analyze

      - name: Test
        run: melos run test
